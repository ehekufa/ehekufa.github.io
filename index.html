<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Кубок Кликер</title>
    <!-- Подключаем Telegram Web App API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            user-select: none;
        }
        #cup {
            font-size: 120px;
            cursor: pointer;
            transition: transform 0.05s;
        }
        #cup:active {
            transform: scale(0.9);
        }
        .progress-bar {
            width: 80%;
            height: 20px;
            background: #333;
            border-radius: 10px;
            margin-top: 20px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: gold;
            width: 0%;
            transition: width 0.1s;
        }
        .btn {
            margin-top: 30px;
            padding: 12px 24px;
            background: #2ea6ff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn:disabled {
            background: #555;
        }
    </style>
</head>
<body>
    <h2>Собери 450 кликов</h2>
    <div id="cup">🏆</div>
    
    <div class="progress-bar">
        <div class="progress-fill" id="progress"></div>
    </div>
    <p id="counter">0 / 450</p>

    <button class="btn" id="withdrawBtn" disabled>Забрать кубок</button>

    <script>
        // Инициализация Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран

        let clicks = 0;
        const TARGET = 450;
        const cup = document.getElementById('cup');
        const counter = document.getElementById('counter');
        const progress = document.getElementById('progress');
        const withdrawBtn = document.getElementById('withdrawBtn');

        // Обработка клика по кубку
        cup.addEventListener('click', () => {
            if (clicks < TARGET) {
                clicks++;
                counter.innerText = `${clicks} / ${TARGET}`;
                progress.style.width = `${(clicks / TARGET) * 100}%`;

                // Вибрация для тактильного отклика (работает в Telegram)
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.impactOccurred('light');
                }

                // Активируем кнопку при достижении цели
                if (clicks === TARGET) {
                    withdrawBtn.disabled = false;
                    tg.HapticFeedback.notificationOccurred('success');
                }
            }
        });

        // Обработка вывода кубка
        withdrawBtn.addEventListener('click', () => {
            // Отправляем данные в бота (на ваш сервер)
            const userData = {
                user_id: tg.initDataUnsafe.user.id,
                clicks: clicks
            };
            
            // Отправка события в Telegram (обрабатывается ботом)
            tg.sendData(JSON.stringify({
                action: "withdraw",
                payload: userData
            }));
            
            // Закрываем мини-приложение после запроса
            tg.close();
        });
    </script>
</body>
  </html>
