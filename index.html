<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Кубок Кликер</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; user-select: none; }
        #cup { font-size: 140px; cursor: pointer; transition: transform 0.1s; }
        #cup:active { transform: scale(0.85); }
        .progress { width: 80%; height: 16px; background: rgba(255,255,255,0.1); border-radius: 10px; margin-top: 30px; overflow: hidden; }
        .fill { height: 100%; background: gold; width: 0%; transition: width 0.1s; }
        .btn { margin-top: 30px; padding: 15px 40px; background: #2ea6ff; color: white; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .btn:disabled { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.3); }
    </style>
</head>
<body>
    <h2>Собери 450 кликов</h2>
    <div id="cup">🏆</div>
    <div class="progress"><div class="fill" id="progress"></div></div>
    <p id="counter">0 / 450</p>
    <button class="btn" id="withdrawBtn" disabled>Забрать кубок</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); 

        let clicks = 0;
        const TARGET = 450;
        const cup = document.getElementById('cup');
        const counter = document.getElementById('counter');
        const progress = document.getElementById('progress');
        const withdrawBtn = document.getElementById('withdrawBtn');

        cup.addEventListener('click', () => {
            if (clicks < TARGET) {
                clicks++;
                counter.innerText = `${clicks} / ${TARGET}`;
                progress.style.width = `${(clicks / TARGET) * 100}%`;
                if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
                if (clicks === TARGET) {
                    withdrawBtn.disabled = false;
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                }
            }
        });

        withdrawBtn.addEventListener('click', () => {
            tg.sendData(JSON.stringify({
                action: "withdraw",
                amount: 1
            }));
            // Убрали tg.close(). Телеграм сам закроет окно и передаст данные!
        });
    </script>
</body>
</html>
