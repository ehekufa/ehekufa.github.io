<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Cubic Battle 4</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  @font-face {
    font-family: 'Comic Relief';
    src: url('https://cdn.jsdelivr.net/gh/andreibioazum-cell/C-Larp@main/assets/fonts/ComicRelief-Regular.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background-color: #380d26; 
    height: 100vh;
    width: 100vw;
    overflow: hidden;
  }

  body {
    font-family: 'Comic Relief', sans-serif;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 0 calc(20px + env(safe-area-inset-bottom));
    user-select: none;
    -webkit-user-select: none;
    position: relative;
  }

  .greeting {
    font-size: 16px;
    color: #ffffff;
    text-align: center;
    margin-top: 10px;
    width: 100%;
  }

  .title-container {
    margin-top: 40px;
    width: 100%;
    text-align: center;
  }

  .title {
    font-size: 32px;
    font-weight: normal;
    letter-spacing: 1px;
  }

  .menu-container {
    display: flex;
    flex-direction: column;
    align-items: flex-start; 
    width: 100%;
    padding-left: 12%; 
    margin-top: 30px;
    gap: 12px;
  }

  .btn {
    width: 65%; 
    max-width: 280px;
    padding: 12px 25px; 
    text-align: left; 
    background-color: #d94b7b; 
    color: white;
    font-family: inherit;
    font-size: 22px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: transform 0.1s, background-color 0.1s;
    -webkit-tap-highlight-color: transparent;
  }

  .btn:active:not(:disabled) {
    transform: scale(0.96);
    background-color: #c43c6a;
  }

  .btn:disabled {
    background-color: #6e2545;
    color: #b58b9c;
    cursor: not-allowed;
    transform: none;
  }

  .footer {
    position: absolute;
    bottom: 30px;
    text-align: center;
    width: 100%;
    font-size: 18px;
    color: #ffffff;
  }

  .error-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #ff4d4d;
    font-size: 18px;
    text-align: center;
    background: rgba(0,0,0,0.8);
    padding: 15px;
    border-radius: 12px;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }
  .shake { animation: shake 0.3s ease-in-out; }
</style>
</head>
<body>

  <div class="greeting" id="greeting">Привет, Игрок</div>

  <div class="title-container">
    <h1 class="title">Cubic Battle 4</h1>
  </div>

  <div class="menu-container">
    <button class="btn" id="clickBtn">КЛИКНУТЬ</button>
    <button class="btn" id="withdrawBtn" disabled>ЗАБРАТЬ</button>
  </div>

  <div class="footer" id="footer">
    Кубки: <span id="cups-count">0</span>
  </div>

  <div class="error-text" id="errorMsg">⚠️ Не так быстро!</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.expand(); 
  tg.ready(); 

  // Красим верх и низ в цвет фона
  const bgColor = '#380d26';
  tg.setHeaderColor(bgColor);
  tg.setBackgroundColor(bgColor);
  if (tg.setBottomBarColor) tg.setBottomBarColor(bgColor);

  const urlParams = new URLSearchParams(window.location.search);
  const playerNick = urlParams.get('nick');
  // Бот передает кубки в ссылке, берем их отсюда
  let currentCups = parseInt(urlParams.get('cups')) || 0; 
  
  const greetingEl = document.getElementById('greeting');
  const clickBtn = document.getElementById('clickBtn');
  const withdrawBtn = document.getElementById('withdrawBtn');
  const cupsCountEl = document.getElementById('cups-count');
  const errorMsg = document.getElementById('errorMsg');

  if (playerNick) {
    greetingEl.innerText = `Привет, "${playerNick}"`;
    cupsCountEl.innerText = currentCups;
  } else {
    greetingEl.innerText = "Ошибка: нет ника";
    clickBtn.disabled = true;
  }

  let clicks = 0; 
  const TARGET = 50;
  let lastClickTime = 0;
  let isBlocked = false;

  clickBtn.addEventListener('click', () => {
    if (!playerNick || clicks >= TARGET) return;

    const now = Date.now();
    if (lastClickTime !== 0 && now - lastClickTime < 30) {
      if (!isBlocked) {
          isBlocked = true;
          errorMsg.style.opacity = '1';
          clickBtn.classList.add('shake');
          setTimeout(() => clickBtn.classList.remove('shake'), 300);
          setTimeout(() => { errorMsg.style.opacity = '0'; isBlocked = false; }, 1000);
      }
      return; 
    }

    lastClickTime = now;
    clicks++;
    clickBtn.innerText = `КЛИКНУТЬ (${clicks}/${TARGET})`;

    if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

    if (clicks >= TARGET) { 
      clickBtn.disabled = true; 
      clickBtn.innerText = "ГОТОВО";
      withdrawBtn.disabled = false; 
    }
  });

  withdrawBtn.addEventListener('click', () => {
    if (!playerNick) return;
    
    withdrawBtn.disabled = true; 
    withdrawBtn.innerText = "ОТПРАВКА...";
    
    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');

    // Визуально прибавляем кубок
    currentCups++;
    cupsCountEl.innerText = currentCups;

    // Отправляем данные в бота (бот закроет окно сам)
    tg.sendData(JSON.stringify({ action: "withdraw", amount: 1 }));

    // Сбрасываем кнопки для следующей игры
    setTimeout(() => {
        withdrawBtn.innerText = "ЗАБРАТЬ";
        clickBtn.innerText = "КЛИКНУТЬ";
        clickBtn.disabled = false;
        clicks = 0;
        withdrawBtn.disabled = true;
    }, 1000);
  });
</script>
</body>
</html>
